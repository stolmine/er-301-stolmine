# ─────────────────────────────────────────────────────────────────────────────
# ER-301 (stolmine) UI map — machine-readable contexts + gestures.
# Spec: planning/headless-emu-plan.md §8 + §11c (ledger item emu-ui-map).
#
# NODES = UI contexts. Each has:
#   desc       one line
#   recognize  a Lua expression returning true iff that screen is on top. Used
#              with the harness `!assert <recognize>` directive (tools/emu_test.py
#              sends `lua <expr>` and requires the reply "true").
#
# EDGES = gesture sequences (control-protocol lines, planning/…-plan.md §2) that
# move from one node to another. `gesture` is a list of literal protocol lines.
# `arrival` is the frame-stripped @trace line the transition emits (with UI trace
# on) — the reachability check (tools/emu_test.py `!reachability`, run by
# tests/emu/30-ui-map-reachability.test) walks every edge from its `from` node and
# asserts BOTH the destination `recognize` predicate AND that `arrival` appears in
# the trace for the gesture.
#
# THE LINCHPIN accessor (verified): the visible screen is the top window of the
# single visible Context —
#   require('Application').getVisibleContext():top():getClassName()
# with getVisibleContext():getInstanceName() as the tie-breaker for the four
# channel/mode variants that share a class.
#   Application.getVisibleContext  xroot/Application.lua:74-76
#   Context:top                    xroot/Base/Context.lua:80-82
#   Object:getClassName            xroot/Base/Object.lua:28-30
#
# CONFIDENCE: every node/edge below was VERIFIED LIVE against the headless emu on
# 2026-07-09 (§11c integration) unless a comment says otherwise. Confidence tags
# read "high (verified live)". The reachability smoke test keeps them honest.
#
# FIXTURE ASSUMPTIONS (testing-assets/emu/fixtures/rear/settings.lua):
#   pickerStyle = "dense"   -> the unit chooser is Unit.Chooser.Dense.
#   sceneMode defaults ON   -> MODE=up shows SceneView.Performance, NOT PinView.
#   animation  = "disabled" -> screens settle immediately.
# Boot selects channel 1, so context instance names read "OUT1 <view>".
#
# Control-protocol note: chorded gestures (e.g. SHIFT+ENTER) are expressed as an
# explicit down/press/up sequence. Toggle switches use `mode {up,center,down}`
# and `storage {up,center,down}` (absolute position). The two toggles are
# ORTHOGONAL: STORAGE selects the top-level Mode (user/admin/eject), MODE selects
# the per-channel view (edit/scope/hold). Mappings verified in
# xroot/boot/app-setup.lua and Application.lua:102-111.
# ─────────────────────────────────────────────────────────────────────────────

[meta]
accessor = "require('Application').getVisibleContext():top():getClassName()"
tiebreaker = "require('Application').getVisibleContext():getInstanceName()"
boot_node = "home"
# Canonical return-to-boot sequence the reachability walk runs before pathing to
# each edge's `from` node. Reaches `home` from every mapped node (verified live):
# leave admin/eject (storage up), leave scope/hold/sequencer (mode center), then
# pop any pushed window (two cancels covers picker/quicksave/sample-pool).
reset = ["storage up", "frames 6", "mode center", "frames 6", "press DIAL2", "frames 6", "press DIAL2", "frames 6"]


# ── nodes ────────────────────────────────────────────────────────────────────

[node.home]
desc = "Main per-channel chain edit view (default after boot). MODE=edit, STORAGE=user."
# high (verified live) — top window Chain.Root, instance "OUT1 edit".
recognize = "require('Application').getVisibleContext():top():getClassName() == 'Chain.Root'"

[node.scope]
desc = "Per-channel oscilloscope / overview view. MODE=scope."
# high (verified live) — Chain.ScopeView, instance "OUT1 scope".
recognize = "require('Application').getVisibleContext():top():getClassName() == 'Chain.ScopeView'"

[node.sequencer]
desc = "Grid sequencer takeover (a sub-view of scope mode)."
# high (verified live) — Sequencer.GridView, instance "OUT1 sequencer".
recognize = "require('Application').getVisibleContext():top():getClassName() == 'Sequencer.GridView'"

[node.hold]
desc = "Hold / scene performance view for the current channel. MODE=hold, scene mode ON."
# high (verified live) — with sceneMode ON (the fixture/default) MODE=up shows
# SceneView.Performance (instance "OUT1 scene"), NOT the legacy PinView. The
# PinView path only appears with scene mode disabled (not the fixture).
recognize = "require('Application').getVisibleContext():top():getClassName() == 'SceneView.Performance'"

[node.admin]
desc = "Admin / System menu (Sample Pool, Global Chains, Settings, Firmware, …). STORAGE=admin."
# high (verified live) — Menu class, instance "Admin".
recognize = "require('Application').getVisibleContext():top():getClassName() == 'Menu' and require('Application').getVisibleContext():getInstanceName() == 'Admin'"

[node.unit_picker_dense]
desc = "Dense 2-column unit chooser (pickerStyle='dense', the fixture default)."
# high (verified live) — Unit.Chooser.Dense.
recognize = "require('Application').getVisibleContext():top():getClassName() == 'Unit.Chooser.Dense'"

[node.unit_picker_classic]
desc = "Classic Mondrian unit chooser (pickerStyle='original'; Category/A-to-Z share this class)."
# medium — NOT reachable under the dense fixture (no inbound edge here); would
# require pickerStyle='original'. Class from xroot/Unit/Chooser/Default.lua:168;
# the Preset sub-mode string was inferred, not read. Left documented, unwalked.
recognize = "require('Application').getVisibleContext():top():getClassName() == 'Unit.Chooser.Default' or require('Application').getVisibleContext():top():getClassName() == 'Unit.Chooser.Preset'"

[node.sample_pool]
desc = "Sample pool browser (list + detail, load/create/slice)."
# high (verified live) — SamplePool.Interface.
recognize = "require('Application').getVisibleContext():top():getClassName() == 'SamplePool.Interface'"

[node.quicksave]
desc = "Quicksave save/load slot grid. Reachable from most screens via SHIFT+MAIN1."
# high (verified live) — QuickSaver.
recognize = "require('Application').getVisibleContext():top():getClassName() == 'QuickSaver'"


# ── edges ────────────────────────────────────────────────────────────────────

# home is the boot node; the toggle edges below are absolute so they also serve
# as "return to a known state" from wherever you are.

[[edge]]
from = "home"
to = "scope"
# high (verified live) — MODE toggle DOWN => "scope".
gesture = ["mode down", "frames 10"]
arrival = "context show OUT1 scope"

[[edge]]
from = "scope"
to = "home"
# high (verified live) — MODE toggle CENTER => "edit".
gesture = ["mode center", "frames 10"]
arrival = "context show OUT1 edit"

[[edge]]
from = "home"
to = "hold"
# high (verified live) — MODE toggle UP => "hold"; with scene mode on this is the
# SceneView performance view (context instance "OUT1 scene").
gesture = ["mode up", "frames 10"]
arrival = "context show OUT1 scene"

[[edge]]
from = "scope"
to = "sequencer"
# high (verified live) — SHIFT+ENTER => commitReleased => sequencer sub-view
# (xroot/Chain/ScopeView.lua; Application.lua). Same gesture toggles back to scope.
gesture = ["down SHIFT", "press ENTER", "up SHIFT", "frames 10"]
arrival = "context show OUT1 sequencer"

[[edge]]
from = "home"
to = "admin"
# high (verified live) — STORAGE toggle CENTER => admin.
gesture = ["storage center", "frames 10"]
arrival = "context show Admin"

[[edge]]
from = "admin"
to = "home"
# high (verified live) — STORAGE toggle UP => user (back to the channel edit view).
gesture = ["storage up", "frames 10"]
arrival = "context show OUT1 edit"

[[edge]]
from = "home"
to = "unit_picker_dense"
# high (verified live) — on the empty boot chain the insert section spans
# MAIN3-MAIN5; pressing MAIN3 selects that spot and its mainReleased ->
# spotReleased fires EmptyControl:activateChooser (xroot/Chain/EmptySection.lua).
# NOTE: plain ENTER at boot does NOT reach it (cursor sits on the header), which
# is why the gesture is a MAIN-button spot press, not ENTER.
gesture = ["press MAIN3", "frames 12"]
arrival = "push Unit.Chooser.Dense"

[[edge]]
from = "unit_picker_dense"
to = "home"
# high (verified live) — CANCEL (DIAL2) closes the chooser.
gesture = ["press DIAL2", "frames 10"]
arrival = "pop Unit.Chooser.Dense"

[[edge]]
from = "admin"
to = "sample_pool"
# high (verified live) — Sample Pool is the SECOND admin menu column; MAIN2's
# mainReleased opens it (MAIN1 is the header/Sample-Pool label spot and does not
# navigate). MAIN3 => Global Chains, MAIN4 => File Recorder.
gesture = ["press MAIN2", "frames 12"]
arrival = "push SamplePool.Interface"

[[edge]]
from = "sample_pool"
to = "admin"
# high (verified live) — CANCEL (DIAL2) pops the pool window back to the Admin menu.
gesture = ["press DIAL2", "frames 10"]
arrival = "pop SamplePool.Interface"

[[edge]]
from = "home"
to = "quicksave"
# high (verified live) — SHIFT+MAIN1 handled at the Context level
# (xroot/Base/Context.lua), gated on Card.mounted(). Works over most screens.
gesture = ["down SHIFT", "press MAIN1", "up SHIFT", "frames 12"]
arrival = "push QuickSaver"

[[edge]]
from = "quicksave"
to = "home"
# high (verified live) — CANCEL (DIAL2) closes the quicksaver.
gesture = ["press DIAL2", "frames 10"]
arrival = "pop QuickSaver"
