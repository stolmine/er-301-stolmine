area = "dsp"
verify = { kind = "manual", ref = "browsing/organizing samples surfaces automatically-detected class labels -- at minimum loop-vs-one-shot and percussive-vs-tonal and a coarse drum family (kick/snare/hat/clap/perc), and optionally a general instrument/sound-event tag -- shown as OVERRIDABLE suggestions (marked auto vs user) that the user can confirm/correct, with user tags persisted as authoritative; all detection is background-batched + cached, never touching the RT audio deadline" }
note = "FEATURE IDEA relayed 2026-07-20; SPLIT OUT of onboard-sample-analysis-browsing (which flagged 'possibly auto-tags/classification' in its WHAT fork) because classification has its own phasing + an opt-in-model decision. Builds ON the classical descriptors that item computes. CLASSIFICATION SPLITS ALONG A DIFFERENT LINE THAN SEARCH (search = classical wins, embeddings a luxury; classification = genuinely mixed): (A) RULES WIN OUTRIGHT, often MORE reliable than ML -- do NOT use a model here: LOOP vs ONE-SHOT (onset-envelope autocorrelation for periodicity + onset count + duration + seamless head/tail boundary check) and PERCUSSIVE vs TONAL/SUSTAINED (attack/decay shape + spectral flatness + pitch salience). (B) RULES ARE SERVICEABLE (good-enough hint, not ground truth) -- COARSE DRUM FAMILY kick/snare/hat/clap/perc from band-energy ratios + centroid + ZCR + flatness + envelope (kick=energy<150Hz+short; hat=high-centroid+high-ZCR+noisy+short; snare=mid-centroid+noise+low body; clap=noisy+multiple micro-onsets); covers the highest-frequency real need (organizing a drum folder) cheaply + explainably. (C) GENUINELY WANTS A MODEL -- fine INSTRUMENT ID (piano/guitar/strings/brass/pad/pluck/vocal; timbre space too overlapping for hand-rules) and SEMANTIC/production tags (riser/impact/vocal-chop/foley/texture). KEY TWIST vs the search decision: classification is MUCH more model-friendly than NL search because a small FIXED-LABEL tagger (YAMNet-class ~15MB tflite, AudioSet labels) is an order of magnitude lighter than CLAP, runs ONCE/sample offline-batch cached, and PRODUCES CLASSICAL TAGS you then search/filter classically -- so it slots into the sample-analysis search decision (see onboard-sample-analysis-browsing) instead of dragging in a vector-search+NL stack. So the footprint pushback that killed CLAP is much SOFTER here; a YAMNet-class tagger is a defensible OPT-IN module. UX CAVEATS: (1) auto-tags are SUGGESTIONS not truth (even ML taggers are AudioSet-domain, imperfect on synthesized/processed modular material) -- surface confirmable/overridable, mark auto(model) vs auto(rule) vs user, PERSIST user corrections as authoritative (also a future fine-tuning corpus); (2) CONFIDENCE-GATED HYBRID -- rules for the confident cheap cases, the tagger only for timbre-ID cases rules cannot touch, show tags only above a confidence threshold. PHASING: Phase 1 (classical, ship first, 'free' budget) = loop/one-shot + perc/tonal + coarse drum family (~70-80% of practical organizing value, fully explainable, no model); Phase 2 (optional, opt-in, footprint-gated per bcdevices-platform os-build-buildroot-vs-debian) = small fixed-label tagger for general instrument/sound-event tags. CAVEAT: CM4/rpidev-line feature (am335x feature-complete; background analysis worker fits the multi-core Pi class)."
links = { depends_on = ["onboard-sample-analysis-browsing"] }

[[item]]
id = "ui-picker-partial-library-load"
title = "Unit picker shows a partial unit list after a degraded card read at boot, with no recovery path"
status = "todo"
modified = "2026-08-05T23:58:05-05:00"
created = "2026-08-05T23:58:05-05:00"
area = "ui"
verify = { kind = "manual", ref = "reproduce a degraded boot (picker missing core units and/or a subset of package units); confirm the front-card libs/*/error.log and the USB serial console name the failing library; then confirm that after the fix the unit list self-heals on card remount without a reboot, and that a library-registration failure is surfaced in the UI rather than only in the log" }
note = "USER REPORT relayed 2026-08-05 (Bram, bench, recurring): opening the unit picker sometimes shows only a handful of units, missing what the user calls 'builtins' plus most package units, with usually a small subset of custom package units still present. Ejecting the front card via the left slider and remounting, then closing and reopening the picker, restores the full list. CODE FINDINGS (confirmed by reading, NOT yet by reproducing): (1) the units users call 'builtins' are NOT builtins -- xroot/Unit/Factory/init.lua:367 registers a small builtins.toc from the firmware, but the core units ship as the CORE PACKAGE installed to the front card under libs/core/, so nearly the entire picker is card-resident and read at boot. (2) Library registration is per-folder and fails silently in the UI: registerExternalLibrary (xroot/Unit/Factory/init.lua:304-339) does loadfile(libs/<folder>/toc.lua) and on failure only calls app.logError + saveErrorReport to libs/<folder>/error.log, so ONE unreadable toc.lua drops that whole library's units while its neighbours load fine. That matches the 'small subset of custom package units' shape exactly, and if libs/core/toc.lua is the casualty then every core unit disappears at once. (3) THERE IS NO RETRY PATH: xroot/Package/Manager.lua:374 cardMounted() sets packageCacheIsStale = true and does nothing else; UnitFactory.reloadLibraries() is only ever called from install/uninstall/boot (Manager.lua:166, 302, 316). So a bad read during boot leaves the unit list degraded for the entire session with no user-visible error. OPEN CONTRADICTION, DO NOT PAPER OVER: by that reading eject+remount should NOT restore the list, because no cardMounted subscriber calls reloadLibraries -- yet the user observes that it does. Either a reload path exists that this audit missed, or the remembered recovery involved another step (e.g. passing through the Package Manager, which DOES call reloadLibraries). Resolve this before writing a fix. NEXT DIAGNOSTICS (cheap, the firmware already logs everything needed): (a) read front-card libs/*/error.log after a degraded boot; (b) capture the USB serial console across a bad boot and diff against a good one, looking for 'Searching <path> for libraries...', 'UnitLibrary(<name>): Failed to open toc.lua.', 'Unit library failed to register: <name>', and especially the per-library 'Parsed <name> TOC: N of M units' line which states each library's exact contribution; (c) open Admin > Package Manager WHILE degraded to separate 'package never loaded' from 'loaded but not enumerated'. Also reseat/swap the SD card in parallel: a card that reads fine under dd can still be marginal on ER-301 cold-boot timing, so the trigger may be hardware while the session-long degradation is firmware. LIKELY FIX SHAPE (pending diagnostics): make cardMounted trigger a library reload (or add an explicit admin 'Reload unit libraries' action), and surface registration failures in the UI instead of only the log. CAVEAT: am335x is feature-complete/patch-only, but this is a data-loss-shaped UX bug (user's units vanish) so it is a defensible patch target; it also carries forward to the CM4 line unchanged."

[[item]]
id = "promote-control-type-spec"
title = "Class-level promotion spec so habitat GainBias subclasses can be promoted"
status = "todo"
modified = "2026-08-13T20:24:37-05:00"
created = "2026-08-13T11:24:58-05:00"
area = "ui"
verify = { kind = "manual", ref = "a habitat control that subclasses GainBias only to add a SHIFT sub-layer (DriveControl, MixControl, BandControl and ~35 others) offers 'promote' in the fan-out menu and promotes transparently, while a discrete mode selector either promotes to a macro of its OWN class (inheriting modeNames and discrete stepping) or does not offer the entry at all" }
note = "FOLLOW-UP to promote-control-to-top-level, filed 2026-08-13 after surveying every unit repo on this box for control types. THE SURVEY, so it is not redone: er-301-habitat has 49 classes that subclass Unit.ViewControl.GainBias; Accents (SuperNiCd), er-301-custom-units (tmfset) and er-301-units (ljwall) have ZERO between them and instantiate the stock classes directly. So the exact-metatable discriminator already covers 227 third-party GainBias controls and 20 third-party Pitch controls, and the entire subclass problem is confined to habitat, which is ours. Instance counts: 515 plain GainBias in habitat, 742 across all four repos, 44 Pitch across all four. THREE FAMILIES among the 49 subclasses, separated cleanly by what they override. FAMILY A (2 classes) overrides init only, different maps/units, semantically identical to GainBias. FAMILY B (~38 classes, 68 instances) overrides setParamMode/onCursorEnter/onCursorLeave/shiftPressed/subReleased/encoder -- the SHIFT sub-layer idiom; bias/gain/branch semantics are untouched, so these are promotable AS PLAIN GAINBIAS today and the only thing missing is a way to say so. FAMILY C (~9 classes, 35 instances: ModeSelector x4, AlgoSelector, EngineSelector, mi MixControl, ScanControl) overrides updateLabel/currentIndex/setIndex/stepDiscrete/encoder -- bias is a quantized mode index. KEY INVERSION: family C is the family that CAN be same-class promoted, because its extra constructor args are pure DATA (modeNames, discrete, discreteCoarseStep) and GainBias:setDefaults stores the original args table verbatim on self.defaults, so the macro is reconstructible; family B CANNOT, because its extra args are Parameter references into the origin unit's own DSP objects (args.toneAmount, args.toneFreq) and a same-class macro would alias them. CORRECTION to what the main plan asserts: family C is NOT a correctness failure. ModeSelector:currentIndex rounds self.bias:getValueInUnits() for display and stepping, so the quantization lives in the CONTROL, not the DSP; a continuous macro driving one is still arithmetically transparent at the moment of promotion, and what degrades is editing (the user can dial a non-integer mode index, and the macro shows a number instead of a mode name). That makes an opt-out default far more defensible than the plan implies. PROTOTYPE LANDED 2026-08-13 (classifier only, NOT wired into the discriminator): Promote.classify(control) returns exact|clone|flatten|nil for a control that SUBCLASSES a promotable class, plus the list of foreign keys that forced a flatten, and tests/emu/81 validates it against real package code. MECHANISM PROVEN: a same-class macro CAN be built. GainBias:setDefaults stores the constructor args table verbatim on the instance, so a subclass's own arguments (modeNames, discrete, the maps) survive; clone defaults, override button/branch/gainbias/range, construct through getmetatable(origin). Verified against biome ModeSelector on Discont -- the clone comes up labelled Fold rather than a bare number. THE RULE IS STRUCTURAL, no package declaration needed: an object-valued entry in defaults outside {branch, gainbias, range, biasMap, gainMap, offset, comparator} means the control is wired to something else in its unit and must not be cloned (userdata, or a table carrying a metatable -- data like modeNames is a plain table, which is why the metatable test matters). No foreign entries means clone the class (families A and C); foreign entries present means build a plain macro for the promoted parameter (family B, whose extra args are Parameters belonging to its unit). The failure direction is safe: an unfamiliar control with extra object args falls back to flatten rather than aliasing. MEASURED against biome + spreadsheet, every unit loaded and every subclass control classified: 70 controls, 28 clone, 42 flatten, and the rule agrees with both semantic signals (setParamMode implies flatten, modeNames implies clone) on all of them but ONE. THE EXCEPTION IS THE INTERESTING RESULT and it is the rule being RIGHT: spreadsheet Vitrail clkSrc is a VitrailClockControl, a ModeSelector that ALSO takes op = self.objects.op because it hosts a tunnel visualization whose rotation IS the A/B clock drift. It carries modeNames and still must not be cloned, because a clone would hold a reference to the ORIGIN unit's DSP object and animate from its internal state. So being a mode selector and being wired into your unit are INDEPENDENT properties, and my earlier claim that family C equals clonable was too coarse -- the structural rule catches an overlap the semantic reading misses. tests/emu/81 carries that as a reviewed exception list; a new entry appearing there is a control to go and read, not a line to add. STILL TO DECIDE before wiring it in: whether the discriminator admits subclasses at all (this is the opt-in vs opt-out fork below), and the residual family C caveats -- after promotion the ORIGIN's fader reads modeNames[0], which is the usual origin-reads-0 behaviour but more jarring when the readout is a word, and defaults is shared BY REFERENCE so a clone shares the origin's modeNames table (harmless for read-only data, wants a shallow copy before shipping). PROPOSED SHAPE: a class-level field in the style of the existing canMove / canEdit declarations, promoteAs = 'GainBias' | 'Pitch' | 'self' | false, declared on the core classes and inherited by Base.Class deep-copy, so family B needs no per-class edit and family C's 9 classes declare 'self'. DECIDE FIRST whether the default is opt-in (nothing changes until a class declares) or opt-out (subclasses inherit GainBias's declaration and family C must opt out); the risk of opt-out is bounded to habitat by the survey above. CAVEAT: am335x is feature-complete/patch-only, so this targets the CM4/rpidev line."
links = { depends_on = ["promote-control-to-top-level"] }
