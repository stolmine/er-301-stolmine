[[item]]
id = "polyphony-poly-container"
title = "Polyphony via a 'polyphonize' poly container (transparent voice cloning, MIDI-driven)"
status = "todo"
modified = "2026-07-15T09:52:29-05:00"
created = "2026-07-15T09:52:29-05:00"
area = "dsp"
verify = { kind = "manual", ref = "a user selects a group of units and 'polyphonize's them into a top-level poly container that transparently clones the selection into N parallel voices behind a mixer; editing inside the container propagates to every clone; a MIDI (or default round-robin) source allocates voices via auto-generated coupling inlets, with optional momentary override by conventional cv/gate; a de-poly procedure unwraps it back; net: an existing single-voice patch becomes polyphonic WITHOUT manual internal rewiring" }
note = "DESIGN IDEA (idea stage), distilled from a 2026-07-15 design chat (crumb dinger + Carson). Polyphony/parallelism is a known ER-301 weak point: the 1D navigation is fundamentally at odds with parallelism, and the classic modular-poly pain is that nobody wants to wire N (virtual) patch cables per voice. CHOSEN DIRECTION (leaning): a POLYPHONIZE POLY CONTAINER modeled on 'move to mixer'. Select a group of units -> wrap them in a TOP-LEVEL poly container that creates INVISIBLE parallel CLONES of the selection behind a mixer (one visible voice, N hidden ones); an edit inside the container PROPAGATES automatically to every clone. I/O routing is taken AWAY from the user (automatic): a MIDI note unit inserted in front routes control output intelligently to the container, which AUTO-GENERATES coupling inlets; a slightly-intelligent, INVISIBLE per-cloned-voice sample-and-hold ties the control coupling together into a coherent system. All-or-nothing by CHAIN (per-unit poly introduces too many edge cases). Momentary override via conventional cv/gate. A DE-POLY procedure unwraps everything. PARKED ALTERNATIVE (Carson): generic per-unit/per-chain parallel channels where each control is switchable MONO (one mod input for all channels) vs POLY (per-channel mod inputs) -- more general (e.g. one quantizer over 4 pitch channels; non-audio parallel duties) but more confusing; the container was judged the better mental-overhead/functionality middle ground, keep the generic form as a possible future generalization. DEPENDENCY: MIDI is the unlock (poly becomes viable/desirable with MIDI + DC-coupled outputs); interim fallback = a default ROUND-ROBIN voice allocator. OPEN QUESTIONS: voice allocation (MIDI vs round-robin; forced assignment at creation vs baked-in assumptions); CONTROL-signal coherence breaks down (Carson's quantizer example: nothing downstream consumes per-channel control outputs -> likely needs global chains with PER-CHANNEL output selection); whether to RESTRICT patching inside poly containers; how a newly-added module integrates into an existing container (auto vs manual coupling); de-poly unwrap semantics; the UI is the HARDEST part (handling the stacked/'vertical' dimension the 1D nav lacks). RELATED ASSETS: (a) crumb dinger already has MULTI-OUTPUT up to 99 slots per unit WORKING + available -- 'takes care of nearly every CV use case in principle' (shift register, offset quantizer); integrating it into core units is a separate, concrete, enabling task. (b) the parallel channels are SIMD-friendly ('made for SIMD') -- a generic NEON wrapper to vectorize an arbitrary selection of operations is a noted perf enabler for the heavy CPU overhead. CAVEAT: huge CPU overhead (invisible clones) accepted as the user's problem; fits the multi-core CM4/rpidev class (am335x feature-complete); vcv poly is a flexible-but-confusing reference. Not yet designed; MIDI implementation likely gates a first cut."
