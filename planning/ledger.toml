# er-301-stolmine ledger — the single machine-readable source of truth for work items.
#
# This file is TRUTH. `planning/TODO.md` is GENERATED from it (`scripts/dev
# render`) — never hand-edit that doc. The gate (`scripts/dev check`, run before
# every commit) reconciles this ledger against the code and tests.
#
# Each item is one INDEPENDENTLY-VERIFIABLE behavior (the BDG grain: a test, a
# screenshot, or a gate) — not per-function, not per-subsystem.
#
# Fields:
#   id      stable kebab slug, unique, immutable (code references it as [stol:<id>])
#   title   one line
#   status  todo | wip | done | blocked
#   area    ui | sequencer | scenes | i2c | dsp | emu | docs | infra
#   rev     integer, bump when the item's intent changes (default 1)
#   verify  { kind = "test"|"screenshot"|"manual", ref = "<test-case name | png | note>" }
#           kind="test" is HARD-gated: a `done` item's ref must name a real TEST_CASE.
#           (No test harness exists yet — tests/ is future work — so use
#           manual/screenshot + attested until one lands.)
#   tests   optional list of ADDITIONAL TEST_CASE names this item owns (beyond
#           verify.ref). Every TEST_CASE in tests/ must be claimed by some item
#           (verify.ref or tests[]) — you can't add a test without ledgering it.
#   attested  REQUIRED for a `done` item whose verify.kind is NOT "test": a non-empty
#           string is a conscious, auditable claim (no silent soft-done).
#   anchor  optional; if true, a `done` item must carry a [stol:<id>] tag in the
#           source tree (od/xroot/emu/hal/mods)
#   links   optional { depends_on = [...], supersedes = [...] }
#   note    optional free text
#
# Tool invocations go through the blessed entrypoint: `scripts/dev {check,render,
# status,now,commit,...}`. Never write a date from memory — ask `scripts/dev now`.

