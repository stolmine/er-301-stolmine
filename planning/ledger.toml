verify = { kind = "manual", ref = "a crash/guard report carries a '--- Heap ---' section (ceiling / arena-highwater / pct / alloc count) with a '*** HEAP NEAR-CEILING ***' banner when the newlib arena is >=90% of the ceiling; inserting the frozen Anamnesis (a footprint/heap-exhaustion bug) shows the arena at/near the ceiling, naming the root class; and (tier 2) a NULL allocation seals an 'alloc-fail' report with the requested size + caller pc" }
note = "planning/crash-diag-harness-sharpening.md P3. Anamnesis root cause = heap exhaustion / footprint (habitat 2026-07-13: designed for more RAM than am335x has). Allocator = newlib malloc via arch/am335x/hal/heap.c Heap_* over __unused_memory_start__..end__ (NOT the SYS/BIOS heap; Memory_getStats measures a different heap + walks a free list). ABORT-SAFETY (P0 lesson): NEVER walk the free list / call mallinfo|Memory_getStats from the fault/Swi capture (that list is what exhaustion corrupts + it locks); track in the Heap_* wrappers into plain globals, capture just READS them. TIER 1: g_heapCeiling (Heap_getUnusedMemorySize), g_heapArenaHighWater (max sbrk(0)-start over allocs = peak footprint toward the ceiling), g_heapAllocCount -> PanicRecord (bump PANIC_VERSION) -> '--- Heap ---' flush + NEAR-CEILING banner + symbolizer lead + injectSynthetic('heap') + tests/emu/49. TIER 2: on a NULL malloc/memalign return, record size + __builtin_return_address(0) + arena, and (armed) seal a PANIC_FAULT_ALLOC_FAIL 'alloc-fail' record from the task context + reboot -> names the failing allocation directly. If exhaustion manifests as OVERLAPPING (non-NULL bad ptr) allocations, Tier 2 will not fire but Tier 1's banner still shows the pressure. SUPERSEDES P2 tier2 (the watchpoint chases a symptom + is DBGEN-gated; P3 names the class + is feasible now). Hardware-only capture; format/viewer/symbolizer emu-testable via the injector. IMPLEMENTED 2026-07-13 (fw 9.5.2.62, emu-verified, bench-pending): tier 1 + tier 2 (record-only, no reboot-on-NULL). DESIGN CORRECTIONS during integration: (1) the plan's sbrk high-water is unbuildable (this malloc is not sbrk-backed; sbrk/mallinfo do not link), so g_heapArenaHighWater = PEAK live in-use bytes accounted via malloc_usable_size() in the Heap_* wrappers (task context; capture reads the global). (2) CEILING FIX: g_heapCeiling is the SYS/BIOS default heap (kernel_heap, __kernel_heap_end__-__kernel_heap_start__ = 20 MB) that malloc actually feeds and where the task stacks + audio Event live (~0x805xxxxx = where Anamnesis corrupts), NOT __unused_memory/BigHeap (the agent's initial pick, which made the pct a misleading cross-region ratio). Now arena-highwater/ceiling is a same-heap exhaustion pct. PANIC_VERSION 7->8, +7 heap fields (record 0x2588 < 0x4000); '--- Heap ---' flush + '*** HEAP NEAR-CEILING ***' banner + 'last-alloc-fail: size=.. pc=..' line; symbolizer leads with it + resolves the fail pc; injectSynthetic('heap'); tests/emu/49. Both arches clean, emu 37/37, symbolizer OK. Bench = arm + insert Anamnesis: expect arena-highwater near the 20MB ceiling + the banner, and (if a NULL) a last-alloc-fail pc in libanamnesis.so. STATUS todo until bench."
