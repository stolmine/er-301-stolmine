note = "planning/crash-diag-harness-sharpening.md P2. Deepest attribution win; P0 confirmed it is the path (no blown stack -> a stray heap write). TIER 1 IMPLEMENTED 2026-07-12 (fw 9.5.2.60, emu-verified, bench-pending): a LAYOUT-PRESERVING pendQ-invariant check (NOT literal guard words -- relocating local.hEvents into a guard struct would move the victim out of the wild write's path and perturb the frozen repro). PanicBuffer_setAudioEvent(local.hEvents) at Audio_init publishes the pendQ header; audioEventGuard() (gated on g_hangArmed, single branch off) runs at the top of the 3 EDMA/error completion handlers BEFORE Event_post, plus a low-rate Swi backstop in HangWatchdog; audioEventGuardBreached() checks the doubly-linked-sentinel invariant (next/prev DDR+aligned, next->prev==q, prev->next==q) with EVERY deref DDR-guarded (no P0-style hang); on breach captureGuardBreach() seals a PANIC_FAULT_GUARD ('event-guard-breach') record reusing the trap/hang spine (module map + stacks + FR + one-shot + reboot). PANIC_VERSION 6->7 (+guardAddr/Next/Prev/Reason, record 0x256c < 0x4000). Flush: '*** EVENT GUARD BREACH ***' banner + '--- Event Guard ---' section (pendQ/next/prev/reason bits next-badptr/prev-badptr/next-link/prev-link); symbolizer leads with it; injectSynthetic('event-guard-breach'); tests/emu/48. Both arches clean, emu 36/36, symbolizer OK. This moves detection to the FIRST post after the pendQ write (Kind=event-guard-breach + first-seen T + the clobbered next= value) and doubles as the ANAMNESIS-FIX VERIFIER (no breach after the habitat fix = fixed). TIER 2 (the writing PC) NOT shipped: the A8 self-hosted monitor-mode DATA WATCHPOINT (DBGWVR/DBGWCR, taken as a Data Abort routing to stolCrashExcHook, LR_abt = corruptor pc) is plausible but GATED on (a) DBGEN asserted -- MDBGen is RAZ/WI unless external DBGEN is high, not firmware/emu-verifiable, and (b) a no-legit-traffic watch target (a Task_Object stack field, whose runtime address only a Tier-1/trap capture pins down). MMU guard page ruled out (1 MB sections over dense live memory). Next step for the pc = a BUILDOPT_CRASH_TEST DBGEN probe (set MDBGen, read it back, watch a local, store, confirm the abort lands in stolCrashExcHook) before any watchpoint ships. STATUS STAYS TODO: verify wants the pc, which needs Tier 2."
