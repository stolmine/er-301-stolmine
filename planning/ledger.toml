attested = "2026-07-12 bench (fw 9.5.2.52, clean BUILDOPT_CRASH_TEST build): the 'h' livelock trigger induced an Audio_callback spin; the Swi Clock monitor FIRED, sealed a record that SURVIVED the warm reboot, and the next boot flushed a 'Kind: hang-watchdog' block to front/crash.log at fw 9.5.2.52 with Thread=audio, Time Since Boot 3.060s, a bounded module map (kernel + teletype + txo), sp=0x805373f4, and a populated 256-byte Stack Window; symbolize_crash.py scanned + resolved the window. All four bench assumptions confirmed: (a) the Clock Swi preempts the spinning audio Task, (b) Task_stat-from-Swi returned a sane SP and the 256-byte copy was fault-free, (c) the window was captured [content quality for a tight leaf-livelock is a follow-up: crashdiag-hang-spin-pc], (d) the panic buffer survived the warm reset on the hang path exactly as the trap path. The verify condition (watchdog fires + snapshots + report appears after reboot) is MET. Implementation commit 436b58b."
