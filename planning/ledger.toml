[[item]]
id = "onboard-sample-analysis-browsing"
title = "Onboard sample-content analysis for browsing (waveform/transient/pitch/loudness)"
status = "todo"
modified = "2026-07-20T18:02:46-05:00"
created = "2026-07-14T18:10:28-05:00"
area = "dsp"
verify = { kind = "manual", ref = "browsing samples (file chooser / sample pool) surfaces computed content analysis to aid selection: at minimum a waveform / peak thumbnail, and optionally transient/onset, pitch or BPM estimate, and loudness; the analysis is budgeted (lazy on-focus and/or a background pass) so it NEVER disturbs the real-time audio deadline" }
note = "FEATURE IDEA relayed 2026-07-14. No existing todo covers analyzing sample CONTENT to aid browsing/selection (distinct from ui-dense-unit-picker-residue, which previews UNITS, and audio-editor selection-scoped-ops, which edits). DESIGN FORKS to settle: (1) WHEN to analyze -- lazy on-focus in the chooser (cheap, only what you look at) vs a background pass over the whole pool (fuller, needs a worker + cache); (2) WHAT to compute, cheapest-first -- a waveform/peak thumbnail (near-free), then transient/onset, then pitch/BPM, then loudness/RMS, and possibly auto-tags/classification; (3) COST CEILING -- this is real-time-audio hardware, so any analysis must be budgeted or fully backgrounded and results cached to the card so it is computed once. Payoff: pick samples by their content at a glance. Likely a CM4/rpidev-line feature (am335x is feature-complete; a background analysis worker also fits the multi-core Pi class better). SEARCH-METHOD DECISION (2026-07-20, classical vs vector embeddings): CLASSICAL MIR IS THE PRIMARY TOOL; do NOT put a neural audio encoder in the base image. Rationale: (a) the things users actually sort/search by are cheap deterministic DSP descriptors -- level (peak/RMS/LUFS/crest), timbre (spectral centroid/flatness/rolloff/ZCR), time (duration/attack/onset-density), pitch+harmony (fundamental, chroma->KEY via Krumhansl-Schmuckler/template match, harmonicity), rhythm (BPM); these are ms to compute, cache once, and are EXPLAINABLE ('surfaced because it is bright, short, in the same key'), which a black-box embedding is not; KEY/HARMONY is a chroma problem, not an embedding problem. (b) VECTOR SEARCH ITSELF IS FREE at this scale -- a personal library is hundreds-to-low-thousands of samples, so brute-force cosine over a few-thousand small vectors is microseconds; NO vector DB / ANN index needed. The cost is the ENCODER (CLAP/PANNs = tens-hundreds of MB weights, hundreds-of-ms-to-seconds/clip on A72 CPU with no useful NN accelerator on CM4, + an ONNX/tflite/ncnn dependency), which fights the minimal-image/Buildroot direction (see bcdevices-platform os-build-buildroot-vs-debian) and must run background-only on the non-isolated cores, never the RT cores 2/3. SWEET SPOT: treat the ~10-15 classical descriptors AS the vector -- normalize + brute-force nearest-neighbor for 'more like this', plus faceted filters/sorts -- giving the similarity-search UX with ZERO ML, deterministic + reproducible. EMBEDDINGS DEFERRED + OPTIONAL, justified by exactly ONE capability classical cannot replicate: natural-language / perceptual query (CLAP-style text<->audio 'find a metallic clang' with no tagging); ship only if NL search becomes a headline feature, and even then as an opt-in module gated on the footprint budget, not baked into the base image. RERANKING: REJECTED (a text-retrieval pattern that transfers poorly to audio and doubles the footprint for marginal gain). Auto-tagging via a pretrained AudioSet tagger (PANNs/YAMNet) is a possible middle option (produces TAGS then searched classically) but still hosts a model, so same footprint caveat."
