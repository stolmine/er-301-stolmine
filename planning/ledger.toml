[[item]]
id = "crashdiag-fix-oneshot-guard"
title = "Crash hook must be one-shot: a post-capture nested fault overwrites the real report (H2)"
status = "done"
created = "2026-07-11T22:40:10-05:00"
modified = "2026-07-11T22:40:10-05:00"
area = "infra"
attested = "2026-07-11 bench (fw 9.5.2.46): the flushed report resolves to the ORIGINAL trap (dfar=0xf0000000, pc in Crash_testTrap), NOT the SYS/BIOS Error_raise/print tail -- the stated pass condition. Two runs each sealed exactly one clean, self-consistent record (no overwrite). The g_captured latch (PanicBuffer.cpp:197) is in place; the adversarial nested-post-hook-fault case was not separately induced, but the observed reports demonstrate the sealed record is preserved, not clobbered by the reboot tail."
verify = { kind = "manual", ref = "on hardware, a trap whose post-hook Error_raise tail itself faults within the ~30ms WDT window must NOT overwrite the sealed record; the flushed report resolves to the original trap (dfar=0xF0000000), not kernel print/error machinery" }
note = "Fable review 2026-07-10 (HIGH). arch/am335x/hal/crash/PanicBuffer.cpp:158-262: the hook resets g_inHook=0 and returns; SYS/BIOS then runs Error_raise->onSystemError->Error_print/System_printf on possibly-corrupt state (verified in vendor Exception.c:184-232). A nested fault re-enters the hook (g_inHook cleared, still armed) and memsets/overwrites the sealed record with the boring nested fault. This is THE misleading-report failure mode, most likely on the messiest crashes. Fix: make capture one-shot — do not reset g_inHook after a successful capture, or add a static g_captured checked at entry (device is rebooting anyway). BENCH-CRITICAL: without this, tomorrow's worst crashes lie."
