[[item]]
id = "promote-control-to-top-level"
title = "Promote an inner control to its container's top-level control interface (one action)"
status = "todo"
modified = "2026-08-13T20:04:43-05:00"
created = "2026-07-15T19:42:22-05:00"
area = "ui"
verify = { kind = "manual", ref = "from an inner control (a unit parameter inside a container / custom unit), a single 'promote to top level' action CREATES the corresponding top-level macro control AND wires it to that inner parameter in one step, replacing the manual dance of building a top-level control and then connecting it back down to the intended object" }
note = "FEATURE IDEA relayed 2026-07-15. Today, exposing an inner parameter as a top-level 'macro' on a container/custom unit is a two-part chore: create the control at the top level, then connect it back DOWN to whichever inner object the macro is meant to drive. Request: a single 'promote to top level' option (on the inner control) that auto-creates the top-level macro + the wiring. Same auto-plumbing philosophy as move-to-mixer / the polyphonize container (take the routing bookkeeping away from the user). LIVES IN: the custom-unit control layer -- xroot/Unit/ControlEditor.lua (top-level control add/edit) + the inner-control context (the SHIFT/menu on a parameter); reuse the existing top-level-control-creation + assignment path, just driven FROM the inner control with the target pre-filled. UI convenience; likely CM4/rpidev-line (am335x feature-complete). DESIGNED 2026-08-13, NOT IMPLEMENTED -- full spec in planning/control-promotion-plan.md (Rev 4, read its CURRENT STATE header first). Scope grew well beyond the original one-action ask: promote from the fan-out menu, pick any ANCESTOR unit via a scope-style picker (origin unit excluded, any depth), then position the macro on the target's strip with the encoder before committing. Semantics settled: macro takes the origin's bias AND gain AND its whole modulation branch; origin becomes bias 0 / gain 1 driven by the macro, so the patch sounds identical at the moment of promotion. THREE adversarial review passes were run against the source during design; passes 1 and 2 each found real blockers, pass 3 returned GO. Blockers found and fixed in the plan, recorded so they are not rediscovered: (1) total silence on hold-mode scenes -- scene deltas are keyed (unitKey, ctrlId) against the BIAS parameter, so an untouched delta drives the origin back to B after promotion giving ~2B, and while a scene is ENGAGED the morpher softSets the base snapshot every frame and simply undoes the promotion; v1 therefore refuses promotion during authoring AND while engaged, and on commit clears the control's delta, its scene.params entry, and rebuilds the morph (setDelta alone is one third of the job and the cleared delta is resurrected at the next quicksave by Scene:_syncDeltasFromParams). (2) Gate and Pitch were declared promotable but neither has a bias/gain pair (Comparator and ConstantOffset), so v1 is GainBias-only. (3) the transplant must NOT regenerate instance keys -- promotion is a MOVE and Chain/Clipboard deliberately suppresses regeneration for exactly that reason; regenerating orphans scene deltas belonging to units INSIDE the moved branch. Clear the origin branch before deserializing and strip only the payload's top-level chain key. Also: the promotability test must be an exact-metatable check, since the Class system deep-copies members so control.type == 'GainBias' matches all 49 habitat subclasses (ModeSelector uses bias as a quantized mode index and would break); exact match still covers ~509 plain habitat GainBias instances. Implementation order and the riskiest step are in the plan's CURRENT STATE header. Targets the CM4/rpidev line; am335x is feature-complete. IMPLEMENTED END TO END 2026-08-13 (bench-pending) -- see planning/control-promotion-plan.md CURRENT STATE. Landed in build order: Phase 1 fader scaling in the GainBias customization path (eb37399, tests/emu/67); exact-metatable discriminator plus four-precondition menu gating in xroot/Unit/Promote.lua (tests/emu/68); the ancestor picker xroot/Unit/PromoteTargetView.lua and inert-macro create/rollback (tests/emu/69), plus a repair to UnitSection:removeControlBranch which leaked a still-running branch and a stale unit.branches entry because it never called stop() and passed a branch OBJECT to Unit:removeBranch(name), which indexes by string (4c86577); placement in xroot/Unit/PromotePlaceView.lua, a PROXY screen in the shape of the Edit Controls list where the encoder walks a name panel along a row of name panels (7a65cab, tests/emu/70 and 75); and the transplant plus the three-part scene clear in Promote.commit (b51290f; tests/emu/71 transplant, 72 double promotion, 73 scene clear with the quicksave-resurrection guard, 74 save/load round-trip, 75 cancel leaves the unit byte-identical). WHAT IS LEFT: bench validation, since the success criterion is AUDIBLE transparency and no emu test can assert it -- promote a dialed-in control on a real patch and confirm the sound does not change, repeat promote/delete for resource lifecycle, and check a promoted control in a patch that also uses scenes. Plan tests 5 (subclass rejection against real habitat), 6 (picker offers exactly the ancestors) and 8 (key uniqueness across the whole tree) have no direct coverage yet. Deferred to v2: clamp forwarding, Pitch support, canMove honoured by placement. BENCH ROUND 1 (2026-08-13) found TWO UX problems, both now fixed and both worth not rediscovering. (A) STRANDED PLACEMENT: the first placement implementation moved the REAL control on the target unit strip and shadowed handlers (encoder/enter/cancel/up/home) on the macro ViewControl instance to steal the encoder. The only exits were those keys ON that control, so moving the cursor away with a main button ended nothing -- shadows stayed installed and the next time the user focused that control and turned the encoder they got the mover instead of the fader, symptom reported as the whole control moves position. Fixed in 035ed1c (losing the cursor ends placement, plus self-healing shadows that strip themselves when no placement names their control). (B) THE IN-PLACE SCREEN WAS THE REAL PROBLEM: creating the macro up front made it look as though the promotion had already happened, the not-yet-placed GainBias was focusable, and turning the encoder after focusing it made the control appear to vanish. User called for an ape of the Edit Control screen as a midpoint between destination selection and actual control use. Done in 7a65cab: xroot/Unit/PromotePlaceView.lua is a SpottedStrip window of name-and-type proxy panels, the macro is one more panel, encoder walks it, ENTER commits. NOTHING IS CREATED UNTIL ENTER, so the plan section 7 create-it-inert-for-a-rollback-boundary argument is moot (createInertMacro and rollback survive only for a commit that refuses after the macro exists), and the whole stranded-shadow bug class disappeared with the in-place screen since a separate window overrides its own methods. xroot/Unit/PromotePlacement.lua and tests/emu/76 were deleted. Also: both promote windows now honour SUB1, since their sub displays draw Promote here / Place here over button 1 and a label naming an action the button does not perform is worse than no label. CONTROL-TYPE CATALOG 2026-08-13 across Accents / er-301-custom-units / er-301-units / er-301-habitat, so it is not redone: 903 promotable-class controls (GainBias 742, Gate 117, Pitch 44). Three structural checks all came back clean -- every one of the 903 wires its branch into the same object the control drives (0 mismatches, 0 built without a branch); the driven object is always ParameterAdapter (490) or app.GainBias (66) or Comparator (99) or ConstantOffset (34), nothing exotic; and no two controls share a driven object or a branch. TWO THINGS RAISED. (1) A unit that writes a promoted control OWN parameter now writes the TRIM rather than the value, because promotion hollows the origin. Of 706 Bias/Offset/Threshold writes across the repos, all but 29 are construction or self-consistent restore; what is left is BOTH COPIES OF MultitapDelay (spreadsheet + stolmine), whose randomize writes masterTime/feedback/feedbackTone/skew directly and whose buffer-resize clamps masterTime. After promoting one of those faders, randomize gives macro + random instead of random, and the buffer clamp silently stops protecting anything. Not fixable from promotion side, follows from the decision to hollow the origin, documented in the plan because it will read as a bug from the bench. Accents/WeightedCoinToss and JF match the same grep and are false positives (internal objects, no control drives them). (2) BranchMeter is now EXPLICITLY excluded rather than merely absent, with tests/emu/80 holding the line: it HAS a branch so it clears the structural gate, but every instance in every repo is a mixer-style audio input level (MixerUnit input, XFade a/b, ABSwitch, Logics, Maths, FadeMixer) in the shape faderParam = objects.X:getParameter(Gain). Its branch carries the SIGNAL, so transplanting the branch contents would relocate the audio source into an ancestor -- that is move-to-mixer, a different operation that already exists -- and it hands over a bare Parameter rather than the object it drives, and the object TYPE is what establishes the composition law. THE GENERAL RULE that falls out: promotability is knowable only when the control hands over a TYPED OBJECT. THREE DEVIATIONS from the plan, recorded in its CURRENT STATE header: (1) createInertMacro snapshots display attributes under pcall PER KEY, because a blanket copy threw on Test Osc freq (its freqGain map has no superCoarseStep), so attribute inheritance is best-effort rather than unconditional; (2) the plan section 7 was WRONG about placement -- it said move the real control on the target strip and rejected the Editor screen because it shows proxies rather than controls; proxies are right precisely BECAUSE they are not the control, see BENCH ROUND 1 (B) above. What survives is UnitSection:rebuildViewFollowingControl, which posts a FOCUSED rebuild under the same trigger key as the unfocused one it replaces, because a plain rebuild regenerates every spot handle while the cursor still holds the old one and enableSelection then falls back to selectLast; (3) the byte-identical-after-cancel test must skip Internal Phase, an oscillator free-running phase accumulator that advances every frame regardless -- runtime state that happens to be serialized, not patch structure."
