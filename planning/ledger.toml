[[item]]
id = "crashdiag-fix-partial-register-capture"
title = "Exc-hook captures only a subset of registers (sp=pc, psr/r1/r8-r11 = ffffffff) on am335x data abort"
status = "todo"
created = "2026-07-11T20:30:05-05:00"
modified = "2026-07-11T20:30:05-05:00"
area = "infra"
verify = { kind = "manual", ref = "on a hardware data-abort capture, sp is a real stack address (not == pc), psr is a valid CPSR (not 0xffffffff), and r1/r8-r11 hold real values — or, if SYS/BIOS's ExcContext genuinely does not populate them on a Cortex-A8 abort, that is confirmed by reading the module source and documented, with the fuller register set captured from the raw abort frame if feasible" }
note = "BENCH FINDING 2026-07-11 (first real hardware capture, fw 9.5.2.16, empty CRASH_TEST). The capture WORKS: panic buffer survived the warm reboot (the make-or-break DRAM-retention assumption HELD), dfar=0xf0000000 exact, r2=0xf0000000/r3=0xdeadbeef (the injected fault), Kind=data-abort, Thread=app, module map + pc->kernel resolution + persist-to-crash.log all correct. BUT sp reads == pc (0x801fe2b8), psr=0xffffffff (invalid CPSR), and r1/r8/r9/r10/r11=0xffffffff while r0/r2/r3/r4/r5/r6/r7/r12 are plausible. The hook (PanicBuffer.cpp:224-243) reads the RIGHT ctx-> fields, so either SYS/BIOS's Exception_ExcContext does not fully populate the banked/secondary regs for an A8 data abort (a documentable limitation) or there's a BIOS-header/version field-offset mismatch. The DIAGNOSTIC-ESSENTIAL set (pc/lr/dfar/faulting values/thread/module map) is intact, so symbolication is unaffected; this is a capture-quality follow-up. Investigate ti/sysbios/family/arm/exc Exception.c/asm for which regs it snapshots; consider grabbing the raw abort stack frame for the full set. RECONFIRMED 2026-07-11 on fw 9.5.2.46 (identical pattern: sp==pc=0x801fe2b8, psr=0xffffffff, r1/r8/r9/r10/r11=0xffffffff, while r0/r2-r7/r12/dfar/dfsr/pc/lr are correct). ROOT CAUSE localized to UPSTREAM of our hook: our hook (PanicBuffer.cpp:224-243) reads the exact Exception_ExcContext fields that SYS/BIOS builds, and vendor Exception.c:253-261 excDumpContext prints those SAME fields -- so SYS/BIOS's own enableDecode UART dump would show the identical sp==pc/psr=0xffffffff. Traced the bios 6.46.05.55 Cortex-A8 data-abort frame (Exception_asm_gnu.asm:99-133 -> Exception.c:110-130): the excStack index->field mapping is internally consistent (psr=excStack[0], sp=excStack[1], r0..r12=excStack[8..20]), so the corrupted set {psr, sp, r1, r8-r11} does not follow a clean off-by-one, pointing at a vendor abort-frame/banked-register capture quirk (or genuine machine state for the rN) rather than our code. Diagnostic-essential set is intact and symbolization is unaffected; capture-quality follow-up only. Next: compare against a live enableDecode UART dump to confirm parity, then either document as a BIOS 6.46 A8 limitation or capture the raw abort stack window ourselves."
