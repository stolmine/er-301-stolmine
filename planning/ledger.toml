note = "planning/crash-diagnostics-plan.md §3 + full DESIGN PASS §8 (2026-07-11). Several habitat sagas FROZE rather than trapped, which the exception hook alone never catches. DESIGN RESOLVED: audio DSP runs in a Task (taskAudio, TASK_PRIORITY_AUDIO=11, EDMA-Event-driven; Audio_callback = package process() = the hang sites), so a Swi-context monitor (SYS/BIOS Clock function, ~100ms) preempts a spinning audio task with NO raw timer/HWI programming (HWI>Swi>Task; default Clock tick, no free DMTIMER needed). Mechanism: (1) heartbeat = g_audioFrames counter bumped per Audio_callback + g_audioRunning flag gated at McASP/EDMA start/stop (essential: a stopped stream also freezes the counter -> false positive without the gate); (2) Clock monitor, armed-only, flags a hang when audioRunning && counter stale K ticks (~250ms); (3) snapshot Kind=hang into the EXISTING panic buffer (reuses flush/flight-recorder/fwVersion/one-shot latch), then reboot(). Coverage: task livelock/NaN-storm (IRQs on) = FULL capture (preempting HWI already saved the full frame); deadlock/blocked = partial (block site); driver-ISR spin = out of MVP; IRQ-disabled spin = hardware WDT1 backstop (phase 2, recovery-only, NO capture, documented gap). KEY NEW PIECE: acquiring a hung task's state -- MVP captures a raw 256-byte stack window + saved SP into PanicRecord (+~0x104, budget fine vs 0x4000) and defers to symbolize_crash.py scanning the window for in-.text return addresses against the module map -> a backtrace, robust to both sub-cases, no bios-internal frame parsing. Bench trigger: extend BUILDOPT_CRASH_TEST so CRASH_TEST first byte 'h' makes Audio_callback livelock (mirrors the 'u' undef / data-abort triggers). Build order in §8.7. reboot()=WDT1 poke, callable from monitor. Zero-cost-when-off (heartbeat gated; Clock only while armed). HARDWARE-ONLY capture; format/viewer/symbolizer-stack-scan emu-testable via a synthetic hang record. PHASE 1 IMPLEMENTED 2026-07-12 (commit 436b58b): audio.c heartbeat (gated on g_hangArmed) + g_audioRunning gate; HangWatchdog.cpp Swi-context Clock monitor (50ms, ~250ms stall, armed-only, lazy-created); PanicBuffer.cpp PANIC_VERSION 3->4, +stackWindow[256]/sp/len (static_assert holds at 0x2330), captureHang() via public Task_stat (verified sets sp=tsk->context, no bios-internal access) reusing the trap one-shot/Cache_wbInv/reboot path byte-untouched; Kind=hang-watchdog + '--- Stack Window ---' flush; weak Crash_hangArm in CrashDiag.cpp arms it on the enableCrashDiagnostics path (emu links the no-op); symbolize_crash.py stack-scan -> innermost-first backtrace; CrashReport.lua injectSynthetic('hang-watchdog'); tests/emu/45-crash-diag-hang-inject.test. VERIFIED: make emu + make firmware ARCH=am335x both clean; emu 33/33 incl. the hang test; symbolizer --selftest OK. STATUS STAYS TODO: the capture path is am335x-hardware-only, unverified until the bench trigger runs (§8.6: drop a CRASH_TEST first-byte 'h' on the front card of a BUILDOPT_CRASH_TEST firmware; expect auto-reboot within ~250-300ms and a Kind=hang-watchdog block with a populated Stack Window + Thread=audio; symbolize against the matching app.elf). Bench must confirm: (a) the Clock Swi actually preempts the spinning audio Task, (b) Task_stat from Swi returns a sane SP + fault-free 256-byte copy, (c) the sp+-128 window catches useful spin frames (the one bench-tunable knob), (d) panic buffer survives the warm reset for the hang path (trap path already confirmed this, reused verbatim). Phase 2 (WDT1 IRQ-off backstop) intentionally deferred."
