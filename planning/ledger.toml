verify = { kind = "manual", ref = "the user can BOOKMARK a top-level control (a gesture on the focused control adds it to a bookmark list), and then quickly HOP between bookmarked controls -- jumping the cursor straight to each bookmarked control's real location in the chain -- via a next/prev gesture and/or a bookmark picker, so navigating a long chain no longer means scrolling spot-by-spot; bookmarks can be removed and survive within the editing session" }
note = "FEATURE IDEA relayed 2026-07-19 (via /remote-control). Ask: a BOOKMARKS feature -- pin a top-level control to a list, then hop through those bookmarks for fast navigation of a (long) chain. DISTINCT FROM two things that already exist, and the entry must not duplicate them: (1) xroot/PinView/ (the stock 'pinned controls' facility: PinSet with control2pin + pinOrder, built on SpottedStrip, aggregates controls from anywhere into a SEPARATE global strip for REMOTE interaction) -- bookmarks are a NAVIGATION aid (jump the cursor to the control's ACTUAL location in the chain view), not a remote-aggregation surface; (2) xroot/Chain/MarkMenu.lua (marks UNITS for bulk cut/copy/move via Chain.Clipboard, chain:getMarkCount) -- that is selection for bulk ops, not a jump list. REUSE CANDIDATES: PinView's PinSet registry pattern (control2pin / pinOrder) is a clean model for the bookmark list; SpottedStrip cursor navigation (leftJustify / scrollToView / setCursorController in xroot/SpottedStrip/) is the mechanism to JUMP the cursor to a bookmarked spot; the bookmark identity is the top-level ViewControl in the chain. LIVES IN: xroot/Chain/ (a per-chain bookmark registry + serialize) + xroot/SpottedStrip/ (cursor jump) + a small UI (a gesture on a top-level control to add/remove a bookmark, plus a next/prev-bookmark gesture and/or a picker list). DESIGN FORKS to settle: (1) SCOPE -- per-chain bookmark list vs a global one; (2) HOP UX -- cycle next/prev via a gesture vs a picker vs a dedicated bookmark strip; (3) PERSISTENCE -- session-only vs serialized with the chain, and how a bookmark survives the bookmarked control being edited/moved/deleted; (4) RELATIONSHIP TO PinView -- either extend PinView with a 'jump to source' affordance (reuse its registry + strip) or ship a separate lightweight bookmark mechanism (leaner, nav-only). Related to promote-control-to-top-level (both operate on top-level controls). CAVEAT: UI feature; am335x is feature-complete / patch-only (project_am335x_feature_complete), so this targets the CM4/rpidev line or a future feature release, not an am335x patch."
