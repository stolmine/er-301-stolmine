[[item]]
id = "infra-crash-diagnostics-debug-mode"
title = "Dev-enabled debug mode captures C-side crash diagnostics (umbrella)"
status = "todo"
created = "2026-07-09T20:55:17-05:00"
modified = "2026-07-09T20:55:17-05:00"
area = "infra"
verify = { kind = "manual", ref = "with debug mode enabled, a deliberately-injected fault in a package .so produces a persisted crash report whose PC/LR resolve via addr2line to the correct package, function, and offset; with debug mode off, steady-state CPU headroom is unchanged" }
note = "PLANNED + SPLIT 2026-07-09 into planning/crash-diagnostics-plan.md: children infra-crash-diag-{format,module-map,flight-recorder,emu-inject,debug-mode-ui,exc-hook,panic-buffer,hang-watchdog}. This item stays the umbrella; done when the children close. KEY design axis: capture half is am335x-hardware-only (traps don't reproduce in emu), presentation half (UI + format + viewer) is emu-verifiable via the headless harness by injecting a synthetic report. Primitives already exist (verified): SYS/BIOS ARM Exception ExcContext+hook (register/thread capture), the dlopen mLoaded map (module bases), xroot/Crash.lua (persisted report). Motivation (researched 2026-07-09 across habitat crash history): the Lua side is already covered — xroot/Crash.lua persists message + traceback + LogHistory to crash.log — but habitat's many crashes are C-side, hardware-only audio-thread traps that today leave ZERO evidence (freeze or silent reboot), so every one cost a multi-day bisect (Ngoma differential-switch saga 2.5.5.92-.98, mi AAPCS/tree-vectorize saga 1.0.3.5-.18, xform-target ABI saga). Recurring root-cause families from habitat lore: -ftree-vectorize NEON alignment-hint traps (top cause), stack-local NEON :64 hints, runtime-branched DSP dispatch with differential bodies, AAPCS spill at audio-thread state swaps, float ulp/wrap edges in delay indexing, SWIG class-size mismatch, package-vs-firmware ABI drift. Firmware crashes by contrast: a handful ever. Capture plan (debug mode = admin toggle, zero steady-state cost when off): (1) ARM abort/undef handlers snapshot PC, LR, SP, CPSR, fault address, and a raw stack window; (2) a module map (kernel base + every loaded package .so base/size) persisted so PC/LR symbolize offline via addr2line against the build artifacts — this single feature would have pointed straight at the trapping vld1 in every NEON saga; (3) audio-thread watchdog heartbeat to catch hangs (several sagas froze rather than trapped) with the same snapshot; (4) flight-recorder ring of recent trigger events (unit insert, engine/mode switch, preset load — every historical crash was user-action-triggered); (5) persistence via a warm-reboot-surviving RAM panic buffer flushed to crash.log on next boot, since writing the card from a fault handler is unsafe. Audit first: what if anything the am335x side does today on data abort (sc.cv bug report assumed a 'crashdump from device' exists — verify). Policy note: AM335x line is patch-only, but this is developer diagnostics serving habitat package dev on real hardware (the crashes do NOT reproduce in emu, so the headless-emu substrate cannot cover this class); also directly portable to the CM4 line where Linux coredumps + the same module-map convention apply. Cross-reference: habitat memory files feedback_disable_tree_vectorize_am335x, feedback_neon_aapcs_call_barrier, feedback_runtime_branched_dsp_dispatch, feedback_neon_hint_surfaces."
links = { depends_on = [] }

