[[item]]
id = "crashdiag-stack-highwater"
title = "Crash report carries per-task + ISR stack high-water and canary (P0)"
status = "done"
modified = "2026-07-12T13:44:32-05:00"
created = "2026-07-12T12:31:03-05:00"
area = "infra"
attested = "2026-07-12 bench (fw 9.5.2.58, the abort-safe build): the frozen Anamnesis insert now CATCHES + reboots + flushes a data-abort report carrying the --- Stacks --- section for all enumerated tasks + isr. RESULT: it PROVED no stack overflow -- every real task stack is healthy (app 42%, adc 36%, log/usb <10%, all canary=ok) -- AND surfaced the actual corruption: a suspect entry 'base=0000001c size=167 used=0 canary=BLOWN' with an empty name = a real Task_Object whose stack ptr / size / env were clobbered to garbage, with a '*** STACK BLOWN ***' banner. The walk stopped right after it (its list-link next was also clobbered). So the bug is a STRAY WRITE into the ~0x80538xxx runtime task/heap region (just above the adc stack top 0x80538128; r4/r5 land there) clobbering a Task_Object + the audio Event pend queue; the next audio ISR Event_post (Event.c:285, dfar=0xb5) walks the clobbered queue and traps. Verify MET (proved no overflow + surfaced the corruptor). Redirects the hunt to P2 crashdiag-object-guard-event (guard/catch the wild write). Earlier .57 hung on corrupted-memory reads -> fixed by DDR range-checks (see the note)."
verify = { kind = "manual", ref = "a crash/hang report includes a '--- Stacks ---' section with every task's base/size/high-water-used/canary-intact + the ISR stack, and a banner when any stack is BLOWN/near-full; inserting the frozen Anamnesis with diagnostics armed names the offending task (used>=size or canary BLOWN) or proves no overflow" }
note = "planning/crash-diag-harness-sharpening.md P0 (HIGHEST VALUE). Closes the attribution gap AND is the UI-coverage entry point AND directly tests the Anamnesis stack-overflow hypothesis. Feasible in bios 6.46: Task_Stat.used (high-water, needs Task.initStackFlag pre-fill 0xBE -- confirm/set in common.cfg; checkStackFlag currently false is fine, we compute at capture), Task_Object_first/next to enumerate ALL tasks, the 0xBE canary + Task_SupportProxy_checkStack, Hwi_getStackInfo for the ISR stack. Add PanicStackEntry[] to PanicRecord (bump PANIC_VERSION), a panicEnumerateStacks() shared by trap hook + hang capture, a '--- Stacks ---' flush section + BLOWN banner, symbolizer parse. Abort-context safety: prefer a self-contained 0xBE scan (bounded memory reads, no scheduler lock) over Task_stat's internal Task_disable in the trap hook. Emu: injectSynthetic a Stacks block + tests/emu/47. HARDWARE capture verified against the frozen Anamnesis insert. IMPLEMENTED 2026-07-12 (emu-verified, bench-pending): PANIC_VERSION 5->6, PanicStackEntry{name,base,size,used,canaryOk} + stacks[16]/isrStack/stackCount/anyStackBlown; panicEnumerateStacks() shared by trap hook + hang capture walks Task_Object_first/next reading t->stack/t->stackSize via a #define ti_sysbios_knl_Task__internalaccess opt-in (avoids Task_stat's abort-unsafe Task_disable; bios-6.46-pinned), self-contained full-descending 0xBEBEBEBE high-water scan from base + canary-at-base, Hwi_getStackInfo for the isr line; '--- Stacks ---' flush after Fault Resolution + '*** STACK <name> BLOWN/NEAR-FULL ***' banner right after Kind; symbolize_crash.py leads with the blown stack as PRIME SUSPECT; injectSynthetic('stacks'); tests/emu/47-crash-diag-stacks. Task.initStackFlag pinned true in common.cfg (was already default-true). VERIFIED: make emu + clean am335x build clean, emu 35/35 incl. 47, symbolizer --selftest OK, static_assert holds (record 0x255C). STATUS STAYS TODO: per-task numbers are hardware-only; bench = re-run the frozen Anamnesis insert, expect the MAIN or DISPLAY task at/over 100% or canary=BLOWN (names the corruptor) OR no blown stack (=> P2 object-guard next). ABORT-SAFETY FIX 2026-07-12 (fw 9.5.2.58): the FIRST bench (fw 9.5.2.57) HUNG on the Anamnesis insert with no report -- the enumeration walked the CORRUPTED task structures (the very thing being diagnosed) and read a clobbered stack pointer / garbage stackSize OUTSIDE mapped DDR, which nested-faulted the abort handler (fault -> hook re-entry -> one-shot bail -> return to faulting load -> re-fault) into an unrecoverable loop, so the device never rebooted. Fixed by range-checking EVERY read against the mapped DDR window (0x80000000..0xA0000000) before dereference: each Task_Handle from Task_Object_next (stop the walk on a bad one), the Task env/name pointer (skip strncpy), and [base, base+size) with a 256 KiB size cap (skip the scan + mark the entry suspect/canary-BLOWN, never fault). DDR is fully MMU-mapped so an in-range read cannot fault and the capped scan cannot run away -- deterministic, no delicate seal/reboot reorder needed. Rebuilt clean .58; emu 35/35, symbolizer OK. Re-bench pending."
links = { depends_on = ["infra-crash-diag-panic-buffer"] }

