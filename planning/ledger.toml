[[item]]
id = "control-shift-subdisplay-indicator"
title = "Detect controls with an extra SHIFT sub-display and surface a discoverability indicator"
status = "done"
modified = "2026-08-12T22:35:41-05:00"
created = "2026-07-16T18:55:47-05:00"
area = "ui"
verify = { kind = "manual", ref = "turn on Admin > Settings > Units > Show SHIFT sub-display marks?, insert a unit with shift sub-display controls (e.g. anamnesis), and confirm ONLY those controls carry the top-left mark and that toggling the setting repaints without reinserting. Automated coverage: tests/emu/65-shift-layer-hint (predicate) and tests/emu/66-shift-layer-hint-habitat (end-to-end on the real anamnesis package)" }
attested = "2026-08-12 emu (tests/emu/65 + 66, both green in a full 42-test run): the probe fires on exactly the 5 anamnesis controls that own a SHIFT sub display (density, field, looper, mix, overview) and on none of header/scope/freeze; with the setting off no mark object is created at all; toggling it on marks them live with no reinsert. Marker rendering confirmed visually in the emu on core Test Osc faders (top-left of the ply, clear of the label row and of the pin mark at top-right). HARDWARE BENCH STILL PENDING."
note = "FEATURE IDEA relayed 2026-07-16. Many controls (numerous examples across er-301-habitat units) have an EXTRA sub-display / expanded view that only appears when you SHIFT on the focused control, but nothing signals that it exists -- pure hidden knowledge, poor discoverability; you either know to try shift or you never find it. Ask: a SYSTEM that (a) DETECTS whether a given control has an additional shift sub-display, and (b) SURFACES a visual indicator for it. LIVES IN: the CORE control base so every package benefits for free -- xroot/Unit/ViewControl/init.lua, which already manages the per-control sub display (self.subGraphic via onCursorEnter/onCursorLeave addSubGraphic/removeSubGraphic) and already routes shift gestures (dialPressed(shifted), spotReleased(spot, shifted)) plus the expanded/context-view path (toggleContext -> callUp hasView/switchView). DESIGN FORKS to settle: (1) DETECTION -- RESOLVED (2026-07-20): DECLARATIVE via a universal firmware mechanism. Add ONE universal way in the core control layer for a unit to DECLARE that a control has shifting/hidden controls underneath it (e.g. a capability flag / a `markHasShiftLayer()` call / a `hasShiftView` the base reads), and the base does everything else (draws the stacked caret). Chosen over auto-detect because it closes the loop UNOBTRUSIVELY as far as refactoring units: an existing unit opts in with essentially a one-liner, no restructuring, and there are no false positives from base-class no-op shift handlers. Auto-detect (base notices an overridden shifted handler / a registered secondary subGraphic/context view) is rejected as fragile. (2) INDICATOR PLACEMENT -- LEADING CANDIDATE (suggested 2026-07-20): DOUBLE-STACK THE FOCUS CARET, i.e. reuse the existing focus/cursor caret already drawn on the focused control and render a second stacked caret when that control has a hidden shift layer. Clever because it (a) does NOT impinge on the control's own graphics -- no new badge competing for cell space -- (b) reuses an element the user already reads as 'this is the active control', extending it to 'and it has more under shift', and (c) is drawn by the base so it is uniform everywhere. Alternatives if the stacked caret reads poorly: a small glyph/badge on the MAIN-display cell (always visible, aids scanning) vs a marker on the SUB display when focused (less clutter) vs both. (3) keep it unobtrusive + consistent (one shared cue, drawn by the base, so habitat + core + community units all get it). Note: a stacked caret is only visible ON THE FOCUSED control, so it aids 'is there more here' once you land on a control but does NOT help scan a whole screen for which controls have hidden layers -- if at-a-glance scanning is wanted, pair it with a faint always-on main-cell mark. CAVEAT: the EXAMPLES live in er-301-habitat (separate repo) but the affordance + indicator belong in 301 CORE (ViewControl) so ALL packages inherit it; this is a UI feature, and am335x is feature-complete / patch-only (project_am335x_feature_complete), so it targets the CM4/rpidev line or a future feature release, not an am335x patch. SHIPPED 2026-08-12, emu-verified, HARDWARE BENCH PENDING. Implemented FIRMWARE-side with STRUCTURAL auto-detection so ZERO packages had to change and third-party packages are covered for free: ViewControl:hasShiftLayer probes self.shiftPressed ~= nil. That works because NO class in the ViewControl hierarchy defines shiftPressed, so there is no inherited no-op for a subclass to override and false-positive on; emu/UIState.lua already used the same w[event] ~= nil test. Probe shiftPressed and NOT shiftReleased: Chain.Base defines shiftReleased and is permanently in the focus chain, and third-party strike DualOptionControl defines shiftPressed with no shiftReleased. Header excluded by id (it grabs SHIFT only to scroll its command lists). Resolved in ViewControl:onInsert, which runs after the parent is attached; Fader and BranchMeter had to start chaining Base.onInsert because the base is no longer a no-op. Setting showShiftLayerHints under Admin > Settings > Units, OFF BY DEFAULT to match how the fork ships, made live by an onShiftLayerHintsChanged signal so toggling repaints without reinserting units. THE MARKER IS A DRAWING (Drawings.Control.ShiftLayer, two offset bars at the top-left of the ply), NOT a label suffix: label mutation was investigated and DISQUALIFIED because labels serialize into pin-set and scene files and into DSP parameter names via ViewControl/Fader.lua getPinControl to PinView/Fader.lua to PinView/PinSet.lua, and getDisplayName reads the INSTANCE name so a label-only suffix would visibly diverge from the editor list, delete dialogs and source chooser. Ply coordinates: y grows UPWARD, y=3 lands on the label row. DELIBERATE GAPS: (1) about 17 habitat controls are custom EncoderControl displays with no name text, so the mark is drawn over a full-bleed custom graphic and is easy to miss there; (2) 7 spreadsheet controls repurpose SHIFT+encoder to scroll a list, which has no structural signature and is intentionally NOT marked, because the mark means SHIFT changes what the sub display shows rather than SHIFT does something; (3) marking ENTER/context views was REJECTED because Unit/init.lua auto-generates a scope context view for nearly every control, so hasView is true almost everywhere and marking it would be wallpaper rather than a signal. Survey basis: 12 habitat packages, 762 control instantiations, none defining a control class from scratch, 58 shift-sub-display slots across 21 units with 48 of them in spreadsheet."
