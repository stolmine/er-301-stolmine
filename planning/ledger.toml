[[item]]
id = "i2c-txo-master"
title = "TXo I2C master output: interrupt-driven CV/gate TX with gain + V/Oct mode"
status = "done"
created = "2026-07-09T20:28:42-05:00"
modified = "2026-07-09T20:28:42-05:00"
area = "i2c"
verify = { kind = "manual", ref = "instantiate TXo TR/CV units; scope TXo expander outputs while driving gate + V/Oct pitch; confirm gain control scales output" }
attested = "2026-03-20 (commit 19bf34f 'Add TXo I2C master output mod'): interrupt-driven I2C master TX to TXo output expanders, with per-unit gain control and V/Oct mode. This is the fork's flagship feature. Bench-validated on hardware against a TXo expander (I2C master addr 0x60, configurable 0x60-0x67). Cannot be exercised in emu (no I2C bus emulation)."
note = "Master takes over the I2C2 CON register during TX; see i2c-teletype-coexist for the shared-peripheral handoff."

[[item]]
id = "i2c-teletype-coexist"
title = "Teletype slave RX coexists with TXo master TX on the shared I2C2 peripheral"
status = "done"
created = "2026-07-09T20:28:42-05:00"
modified = "2026-07-09T20:28:42-05:00"
area = "i2c"
verify = { kind = "manual", ref = "with a Teletype leading and a TXo following, confirm ER-301 receives SC.CV/SC.TR from Teletype (slave 0x31) while simultaneously driving the TXo (master 0x60); no crash" }
attested = "2026-03-20 (commit 19bf34f, refined through the 9.x line): single I2C2 peripheral shared between slave (Teletype, addr 0x31) and master (TXo). Master claims the CON register during TX, then restoreSlaveMode() re-enables slave RX after. Documented in docs/KNOWLEDGE.md 'I2C System'. Hardware-verified; the README warns users to pick leading OR following per patch since doing both has shown crashes in some faderbank bursts (F8R issue still open)."
links = { depends_on = ["i2c-txo-master"] }
note = "F8R/16n faderbank at 400kHz still fails as a leader (open, tracked in KNOWLEDGE.md); Crow + Teletype work."

