[[item]]
id = "crashdiag-fix-package-symbolication"
title = "Offline symbolication of package PCs is broken by design — the headline use case (H1)"
status = "done"
created = "2026-07-10T10:48:48-05:00"
modified = "2026-07-10T10:48:48-05:00"
area = "infra"
attested = "2026-07-10: symbolize_crash.py replicates the loader's ET_REL section-packing (4-byte align, text-space-only, section-header order per ElfFile.cpp) and resolves package PCs via the section symtab. Verified without hardware: a real arm-none-eabi ET_REL fixture resolves beta_fn correctly where the OLD code gave confidently-wrong gamma_fn; --selftest green (section-walk + symtab-as-truth). Also handles the addr2line ET_REL DWARF-ambiguity by corroborating against symtab. Commit f6c5c5b."
verify = { kind = "manual", ref = "take a real captured PC inside a loaded package, run symbolize_crash.py, and confirm it resolves to the correct file:line (cross-checked against nm/objdump of the .so)" }
note = "Fable review 2026-07-10 (HIGH, toolchain-only — no hardware risk). am335x packages are ET_REL relocatables built -ffunction-sections; the loader (ElfFile.cpp:171-241) repacks every SHF_ALLOC non-write section sequentially with 4-byte align into mpTextSpace. So pc-textBase is an offset into a repacked blob across hundreds of .text.* sections whose sh_addr are all 0. symbolize_crash.py:115 feeds that to addr2line as a link-time vaddr → ??:0 or CONFIDENTLY WRONG file:line. On-device 'libX.so + off' attribution is still correct; only the offset->file:line step is broken — and packages are exactly the habitat NEON-saga sites the feature targets. The §7 bench test faults in KERNEL code so it never exercises this. Fix: symbolize_crash.py must replicate the loader's deterministic section packing (walk SHF_ALLOC non-write section headers in order, ELF_ALIGNUP(4), find which section the blob offset lands in, addr2line -j <section> <section_offset>, or use the section symtab). All inputs are in the .so it already reads."
