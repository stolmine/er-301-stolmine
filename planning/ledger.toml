[[item]]
id = "crashdiag-heap-stats"
title = "Heap pressure + allocation-failure in the crash report (P3, the heap analog of P0)"
status = "todo"
modified = "2026-07-13T13:02:15-05:00"
created = "2026-07-13T12:24:21-05:00"
