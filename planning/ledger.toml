note = "planning/crash-diag-harness-sharpening.md P1a. Today the Swi Clock monitor watches ONLY audio; a UI-thread spin (hanging constructor, infinite draw) yields NO report. Add g_uiFrames + g_uiBusy (exposed to Lua via a CrashDiag glue call, no-op when disarmed). In xroot/Application.lua loop(): set busy=true + bump at startEventTimer() (processing begins; that seam already exists -- inspect it, it may already be a soft event-duration watchdog to piggyback on), clear busy before waitForEvent() (idle block). Monitor: g_uiBusy && g_uiFrames stale K ticks -> captureHang targeting the main task (reuse the live-SP path; Task_self() in the Swi is the spinning main task). The idle-block gate is the crux: Events_wait legitimately blocks, so a bare loop-stall is not a hang. Reuses the hang-watchdog spine. 'U' bench trigger analog to 'h'. IMPLEMENTED 2026-07-13 (fw 9.5.2.63, emu-verified, bench-pending). DESIGN DECISION -- OPTION C (user-chosen): UI-hang detection is a SEPARATE opt-in (g_uiHangArmed / the enableUiHangDetection setting -> app.uiHangArm -> Crash_uiHangArm), NOT armed by the general 'Enable crash diagnostics?' toggle. Rationale: the ~250ms audio threshold is WRONG for the UI thread, which legitimately runs long SYNCHRONOUS ops (preset load, package install, graph recompile) that would false-trip + warm-reboot. So: (1) separate opt-in (zero UI-reboot risk in normal use), (2) UI_STALL_TICKS=60 (~3s, well above any gesture/draw), (3) a Busy.status pump (app.uiHeartbeat(true)) keeps a PROGRESSING long op alive so only a genuinely stuck main thread trips. g_uiFrames/g_uiBusy in HangWatchdog; Application.lua loop() bumps at startEventTimer / clears before waitForEvent; monitor UI check gated on g_uiHangArmed uses captureHangTask(g_uiTask); PanicBuffer_captureHang refactored to panicCaptureHangTask(t) (audio path byte-identical); 'U' checkTestTrigger arms the UI opt-in. INTEGRATION: merged onto the P3-committed tree (both agents ran parallel); reconciled the g_uiCrashTest dup + applied the P3 heap panicFillHeap into the refactored captureHang. Both arches clean, emu 38/38, symbolizer OK. Thread name reads 'app' (the main task env), not 'main'. STATUS todo until the 'U' bench confirms the capture (Thread=app hang-watchdog, stack window into the UI dispatch)."
