note = "BENCH FINDING 2026-07-12 (fw 9.5.2.52, the FIRST hardware hang capture, see infra-crash-diag-hang-watchdog). Capture works end to end, but the Stack Window for the 'h' tight while(1) livelock resolved to ti_sysbios_knl_Idle_run (Idle.c:72), Task_schedule (Task.c:134), Memory_alloc -- scheduler + stale frames, NOT the Audio_callback spin site. Two compounding causes: (1) for a currently-SPINNING task, Task_stat's saved SP (tsk->context) is STALE -- set at the task's last context-switch-OUT, not its live SP, and a Swi preemption does not update the TCB context, so the window is centered on an old frame; (2) a tight while(1){} leaf loop pushes no new call frames, so there is no live return-address chain near the saved SP. The DEADLOCK / blocked-task sub-case is UNAFFECTED (saved SP is exactly the block site) -- this only degrades the tight-spin sub-case. FIX: capture the LIVE interrupted context from the Clock Swi (the audio task's PC + SP at the moment the Swi preempted it) instead of / in addition to Task_stat's saved SP; that PC is the exact spin location, and centering the window on the LIVE sp gives the real frames. Requires reading the interrupted frame from Swi context (plan section 8.4 deferred this as the harder path). Sibling of the trap-path partial-register refinement. IMPLEMENTED 2026-07-12 (emu-verified, bench-pending): PanicBuffer.cpp captureHang now uses Hwi_getTaskSP() (the a8 Hwi dispatcher's saved interrupted-task SP -- set once on the task->ISR switch, nesting-safe, valid through the Clock Swi) for the LIVE sp when Task_self()==g_audioTask (audio was RUNNING = spinning), and keeps Task_stat's saved SP for the BLOCKED sub-case (Task_self != audio); window now biased UPWARD from sp (descending-stack callers). New PanicRecord.hangRunning (PANIC_VERSION 4->5) + 'Hang State: running (spin)|blocked' flush line so the reader knows whether sp is the live spin or the saved block site. Lua injector + format doc + emu test updated; make emu + clean BUILDOPT_CRASH_TEST am335x build (fw 9.5.2.53) clean, emu 45-hang test + symbolizer selftest pass. STATUS STAYS TODO until the bench confirms the 'h' livelock now resolves to Audio_callback/taskAudio (not Idle/Task_schedule). CAVEAT: the monitor watches the AUDIO thread only -- a UI-thread constructor hang on insert would not fire it (would need a separate UI-thread heartbeat)."
